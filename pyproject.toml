[project]
name = "lightdock"
dynamic = ["version"]
description = "A macromolecular docking framework"
license = "GPL-3.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "scipy>=1.15.3",
    "prody>=2.6.1",
    "freesasa>=2.0.3",
]

authors = [
    {name = "Brian Jimenez", email = "br.jimenezgarcia@gmail.com"},
]
maintainers = [
    {name = "Brian Jimenez", email = "br.jimenezgarcia@gmail.com"},
]

keywords = ["lightdock", "docking", "protein", "molecules", "DNA", "RNA", "peptide"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://lightdock.org/"
Documentation = "https://lightdock.org/tutorials"
Repository = "https://github.com/lightdock/lightdock"
Issues = "https://github.com/lightdock/lightdock/issues"

[build-system]
requires = [
    "setuptools>=82.0.1",
    "numpy>=1.17.1",
    "cython>=3.2.8",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "lightdock.version.CURRENT_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests", "tests.*", "venv*"]
